[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "robertoaferreira111-hue", email = "robertoaferreira111@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "libpass[bcrypt]>=1.9.3",
